server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /health {
        default_type text/plain;
        return 200 "ok";
    }

    # react-router uses client-side routing — any path that isn't a real
    # static asset falls back to index.html so deep links (e.g. /builder)
    # work on a hard refresh.
    location / {
        try_files $uri /index.html;
    }
}
