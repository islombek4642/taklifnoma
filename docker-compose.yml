services:
  backend:
    build: ./backend
    container_name: taklifnoma_backend
    restart: on-failure:5
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PORT=3000
      # Templates/music live here, on the same persistent volume as the DB
      # (content/templates/<id>, content/music/<id>) — an admin upload flow
      # will write new folders into this same path later.
      - CONTENT_DIR=/app/data/content
      # Mini App calls this API cross-origin from its own domain — needs CORS.
      - MINIAPP_ORIGIN=https://${MINIAPP_DOMAIN}
      - VIRTUAL_HOST=${API_DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${API_DOMAIN}
      - LETSENCRYPT_EMAIL=${SSL_EMAIL}
    volumes:
      - backend_data:/app/data
    expose:
      - "3000"
    networks:
      - backend_net
      - proxy_network

  bot:
    build: ./apps/bot
    container_name: taklifnoma_bot
    restart: on-failure:5
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MINIAPP_URL=https://${MINIAPP_DOMAIN}
      - BACKEND_API_BASE_URL=http://backend:3000
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
    networks:
      - backend_net

  miniapp:
    build:
      context: ./apps/miniapp
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}
        VITE_PUBLIC_SITE_BASE_URL: https://${DOMAIN}
    container_name: taklifnoma_miniapp
    restart: on-failure:5
    environment:
      - VIRTUAL_HOST=${MINIAPP_DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${MINIAPP_DOMAIN}
      - LETSENCRYPT_EMAIL=${SSL_EMAIL}
    expose:
      - "80"
    networks:
      - proxy_network

  public-site:
    build: ./apps/public-site
    container_name: taklifnoma_public_site
    restart: on-failure:5
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_API_BASE_URL=http://backend:3000
      - PORT=4000
      - BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=4000
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${SSL_EMAIL}
    expose:
      - "4000"
    networks:
      - backend_net
      - proxy_network

networks:
  backend_net:
  proxy_network:
    external: true

volumes:
  backend_data:
    name: taklifnoma_backend_data
